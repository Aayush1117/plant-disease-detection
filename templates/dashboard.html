<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Dashboard</title>

<style>
body{
    font-family:Arial;
    background:#eaf5ea;
    margin:0;
}
.container{
    width:1000px;
    margin:25px auto;
    background:#fff;
    border-radius:18px;
    padding:25px;
}
h1{
    text-align:center;
    color:#0a5b2a;
}
.stats{
    display:flex;
    justify-content:space-between;
    margin:30px 0;
}
.card{
    width:30%;
    background:#f5f5f5;
    text-align:center;
    padding:20px;
    border-radius:12px;
    box-shadow:0 2px 6px rgba(0,0,0,.1);
}
.card h2{
    margin:10px 0;
    color:#198754;
    font-size:32px;
}
.chart{
    text-align:center;
    margin-top:20px;
}
.chart img{
    width:420px;
}
.btn{
    display:inline-block;
    margin-top:25px;
    text-decoration:none;
    background:#1976d2;
    color:white;
    padding:12px 22px;
    border-radius:10px;
}
</style>

</head>
<body>

<div class="container">

<h1>📊 AI Dashboard</h1>

<div class="stats">

<div class="card">
<h3>Total Scans</h3>
<h2>{{ total }}</h2>
</div>

<div class="card">
<h3>Average Confidence</h3>
<h2>{{ avg_conf }}%</h2>
</div>

<div class="card">
<h3>Average Severity</h3>
<h2>{{ avg_severity }}%</h2>
</div>

</div>

<div class="chart">
<h2>Disease Distribution</h2>

<img src="/{{ chart }}">

</div>

<div style="text-align:center;">

<a href="/" class="btn">
⬅ Back to Home
</a>

</div>

</div>

</body>
</html>
